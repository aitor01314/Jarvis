[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — Plataforma de IA personal (100% gratuita, con failover de proveedores)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24"]
gpu = ["pynvml>=11.5"]  # métricas de GPU NVIDIA (opcional)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = { find = { include = ["core*", "system_daemon*"] } }
